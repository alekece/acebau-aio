[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Alexis Le Provost <alexis.leprovost@outlook.com>"]
license-file = "LICENSE"
repository = "https://github.com/alekece/acebau-aio"

[workspace]
members = [
    "crates/unit",
    "crates/unit-derive",
    "crates/database",
    "crates/database-derive",
    "crates/api",
    "crates/cli",
    "crates/config",
    "crates/core",
    "crates/modules/activity",
    "crates/modules/analytics",
    "crates/modules/catalogue",
    "crates/modules/files",
    "crates/modules/finance",
    "crates/modules/inventory",
    "crates/modules/invoice",
    "crates/modules/machine",
    "crates/modules/order",
    "crates/modules/part",
    "crates/modules/production",
    "crates/modules/recipe",
    "crates/modules/reseller",
    "crates/modules/settings",
]
resolver = "3"

[workspace.dependencies]
acebau-unit = { path = "crates/unit" }
acebau-unit-derive = { path = "crates/unit-derive" }
acebau-core = { path = "crates/core" }
acebau-config = { path = "crates/config" }
acebau-database = { path = "crates/database" }
acebau-database-derive = { path = "crates/database-derive" }
acebau-machine = { path = "crates/modules/machine" }
acebau-activity = { path = "crates/modules/activity" }
acebau-analytics = { path = "crates/modules/analytics" }
acebau-catalogue = { path = "crates/modules/catalogue" }
acebau-files = { path = "crates/modules/files" }
acebau-finance = { path = "crates/modules/finance" }
acebau-inventory = { path = "crates/modules/inventory" }
acebau-invoice = { path = "crates/modules/invoice" }
acebau-order = { path = "crates/modules/order" }
acebau-part = { path = "crates/modules/part" }
acebau-production = { path = "crates/modules/production" }
acebau-recipe = { path = "crates/modules/recipe" }
acebau-reseller = { path = "crates/modules/reseller" }
acebau-settings = { path = "crates/modules/settings" }
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["derive"] }
clap-config-fallback = { version = "0.1.11", features = ["derive"] }
derive_more = "2.0.1"
snafu = "0.8.6"
serial_test = "3.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_with = "3.14.0"
uuid = "1.17.0"
url = "2.5.4"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "bigdecimal"] }
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
itertools = "0.14.0"
assert_matches = "1.5.0"
argon2 = "0.5.3"
axum = "0.8.4"
async-graphql = { version = "7.0.17", features = ["uuid", "chrono", "decimal"] }
async-graphql-axum = "7.0.17"
email_address = "0.2.9"
tokio = "1.47.1"
tower = "0.5.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
tower-http = "0.6.6"
rust_decimal = "1.39.0"
