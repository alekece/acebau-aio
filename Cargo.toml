[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
authors = ["Alexis Le Provost <alexis.leprovost@outlook.com>"]
license-file = "LICENSE"
repository = "https://github.com/alekece/acebau-aio"
description = "All-in-one Acebau toolkit for managing products, clients, bids and internal operations"

[workspace]
members = [
    "crate/unit",
    "crate/database",
    "crate/database-derive",
    "crate/server",
]
resolver = "3"

[workspace.dependencies]
acebau-unit = { path = "crate/unit" }
acebau-database = { path = "crate/database" }
acebau-database-derive = { path = "crate/database-derive" }
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["derive"] }
derive_more = "2.0.1"
snafu = "0.8.6"
serial_test = "3.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_with = "3.14.0"
uuid = "1.17.0"
url = "2.5.4"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres"] }
strum = "0.27.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
itertools = "0.14.0"
assert_matches = "1.5.0"
