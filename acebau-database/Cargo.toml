[package]
name = "acebau-database"
version = "0.1.0"
edition = "2024"

[features]
default = ["json", "bson", "postgres"]
sql = []
postgres = ["sql", "sqlx/postgres"]
json = ["serde_json"]
bson = ["dep:bson"]

[dependencies]
acebau-core = { path = "../acebau-core", features = ["sqlx"] }
thiserror = "2.0.11"
async-trait = "0.1.86"
ulid = { version = "1.2.0", features = ["serde", "uuid"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.15.0", features = ["v4"] }
sqlx = { version = "0.8.3", features = ["chrono", "runtime-tokio", "uuid"] }
derive_more = { version = "2.0.1", features = ["deref", "deref_mut"] }
iso8601 = { version = "0.6.2", features = ["serde"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = { version = "1.0.139", optional = true }
strum = { version = "0.27.1", features = ["derive"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
bson = { version = "2.13.0", optional = true }
