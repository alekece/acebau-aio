[package]
name = "acebau-backend"
version = "0.1.0"
edition = "2021"

[features]
default = ["color", "postgres"]
postgres = ["sqlx/postgres"]
color = ["dep:color-eyre"]

[dependencies]
acebau-core = { path = "../acebau-core" }
actix-web = "4.9.0"
color-eyre = {version = "0.6.3", optional = true }
eyre = "0.6.12"
serde_json = "1.0.139"
serde = { version = "1.0.218", features = ["derive"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio"] }
url = { version = "2.5.4", features = ["serde"] }
thiserror = "2.0.11"
ulid = { version = "1.2.0", features = ["serde", "uuid"] }
uuid = { version = "1.14.0", features = ["serde"] }
async-trait = "0.1.86"
actix-service = "2.0.2"
actix-http = "3.9.0"
